name: Update market snapshot
on:
  schedule:
    - cron: '30 21 * * 1-5'   # 04:30 WIB, setelah pasar AS tutup
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-market.mjs
      - run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add market-data.json market-data.js; git diff --cached --quiet || (git commit -m "Update market snapshot" && git push)
