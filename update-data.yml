name: Update data pasar harian & deploy

on:
  schedule:
    - cron: "30 23 * * *"     # 06:30 WIB — setelah bursa AS tutup (data harian utama)
    - cron: "30 9 * * 1-5"    # 16:30 WIB (hari kerja) — setelah bursa Asia & Eropa tutup
  workflow_dispatch: {}        # tombol "Run workflow" manual di tab Actions
  push:
    branches: [main]
    paths-ignore: [data.js, data-meta.json, README.md]   # deploy ulang saat kode berubah (commit data oleh bot tidak memicu loop)

permissions:
  contents: write              # bot commit data.js
  pages: write                 # deploy ke GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil data pasar terbaru
        id: fetch
        run: |
          if python update_data.py; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Semua sumber data gagal; situs tetap memakai data.js sebelumnya."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit data.js & data-meta.json
        if: steps.fetch.outputs.ok == 'true'
        run: |
          git config user.name  "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js data-meta.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data pasar $(date -u +%F\ %H:%M) UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Susun folder situs
        run: |
          mkdir -p _site
          cp -r index.html css js data.js data-meta.json sw.js manifest.webmanifest icon-192.png icon-512.png .nojekyll _site/
          sed -i "s/__BUILD__/${GITHUB_RUN_ID}-$(date -u +%Y%m%d%H%M)/" _site/sw.js
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
