name: Update data pasar harian
on:
  schedule:
    - cron: "30 23 * * *"   # tiap hari 23:30 UTC (06:30 WIB). Ubah sesuai kebutuhan, mis. "*/30 * * * *" untuk tiap 30 menit
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python update_data.py
      - name: Commit data.js
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.js; git diff --cached --quiet || git commit -m "data pasar $(date -u +%F)"; git push
