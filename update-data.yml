name: Update data pasar harian

on:
  schedule:
    # Senin-Jumat, tiap 3 jam (UTC): tangkap Asia, Eropa, dan penutupan AS.
    - cron: "10 0,3,6,9,12,15,18,21 * * 1-5"
    # Sabtu: satu kali (kripto + data akhir pekan)
    - cron: "10 2 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil data pasar & tulis data.js
        run: python update_data.py

      - name: Commit bila ada perubahan
        run: |
          git config user.name  "berita-angin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "data: update pasar $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
