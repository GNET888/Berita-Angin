name: Update data harian

on:
  schedule:
    - cron: "15 */6 * * *"      # tiap 6 jam (UTC); minimal sekali sehari
  workflow_dispatch: {}          # tombol "Run workflow" manual
  push:                          # jalan langsung saat skrip/workflow diganti (data.js terisi tanpa menunggu jadwal)
    paths:
      - "update_data.py"
      - ".github/workflows/update-data.yml"

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambil data terbaru
        run: python3 update_data.py
      - name: Commit jika ada perubahan
        run: |
          git config user.name  "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.js liquidity.json
          git diff --cached --quiet || (git commit -m "data: update $(date -u +%F\ %H:%M)" && git push)
