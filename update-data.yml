name: Update data pasar harian

on:
  schedule:
    # 10:30 UTC = 17:30 WIB (setelah IHSG & bursa Asia tutup)
    - cron: "30 10 * * 1-5"
    # 22:30 UTC = 05:30 WIB (setelah Wall Street tutup)
    - cron: "30 22 * * 1-5"
    # Sabtu 03:00 UTC: kripto + penutupan Jumat
    - cron: "0 3 * * 6"
  workflow_dispatch: {}   # tombol "Run workflow" untuk update manual

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarik data terbaru
        run: python update_data.py

      - name: Commit bila ada perubahan
        run: |
          if git diff --quiet -- data.js; then
            echo "Tidak ada perubahan."
          else
            git config user.name  "data-bot"
            git config user.email "data-bot@users.noreply.github.com"
            git add data.js
            git commit -m "data: update pasar $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
