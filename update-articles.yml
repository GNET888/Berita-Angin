# Simpan sebagai .github/workflows/update-articles.yml
name: update-articles
on:
  schedule:
    - cron: "30 22 * * *"   # 05.30 WIB setiap hari (sebelum pembaca bangun)
    - cron: "0 6 * * *"     # 13.00 WIB, penyegaran siang
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambil berita pasar + foto -> articles.json
        run: python update_articles.py
      - name: Commit bila berubah
        run: |
          git config user.name "berita-angin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add articles.json
          git diff --staged --quiet || (git commit -m "articles: berita pasar harian" && git push)
